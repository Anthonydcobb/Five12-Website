{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center">🚀 Pending User Approvals</h2>

    <form id="approvalForm">
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Select</th>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Admin</th>  <!-- ✅ Admin Column -->
                </tr>
            </thead>
            <tbody>
                {% for user in pending_users %}
                <tr>
                    <td>
                        <input type="checkbox" class="approve-checkbox user-checkbox" value="{{ user.id }}">
                    </td>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <input type="checkbox" class="admin-checkbox" data-id="{{ user.id }}">  <!-- ✅ Fixed data-id -->
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <button type="button" class="btn btn-success" onclick="approveUsers()">✅ Approve Selected</button>
        <button type="button" class="btn btn-danger" onclick="denyUsers()">❌ Deny Selected</button>
    </form>
</div>

<script>
function approveUsers() {
    let selectedUsers = [];
    let adminUsers = [];

    document.querySelectorAll(".approve-checkbox:checked").forEach(cb => {
        let userId = cb.value;
        selectedUsers.push(userId);

        // ✅ Check if the admin checkbox is selected for this user
        let adminCheckbox = document.querySelector(`.admin-checkbox[data-id="${userId}"]`);
        if (adminCheckbox && adminCheckbox.checked) {
            adminUsers.push(userId);
        }
    });

    if (selectedUsers.length === 0) {
        alert("❌ No users selected.");
        return;
    }

    fetch("{{ url_for('main.approve_users') }}", {  // ✅ Fixed Blueprint reference
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_ids: selectedUsers, admin_ids: adminUsers })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("✅ Users Approved!");
            location.reload();
        } else {
            alert("❌ Error approving users.");
        }
    })
    .catch(error => console.error("Error:", error));
}

function denyUsers() {
    let selectedUsers = [];
    document.querySelectorAll(".approve-checkbox:checked").forEach(cb => {
        selectedUsers.push(cb.value);
    });

    if (selectedUsers.length === 0) {
        alert("❌ No users selected.");
        return;
    }

    if (!confirm("❌ Are you sure you want to deny these users? This action cannot be undone.")) {
        return;
    }

    fetch("{{ url_for('main.deny_users') }}", {  // ✅ Fixed Blueprint reference
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_ids: selectedUsers })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("❌ Users Denied and Removed.");
            location.reload();
        } else {
            alert("⚠️ Error denying users: " + data.error);
        }
    })
    .catch(error => console.error("Error:", error));
}
</script>
{% endblock %}
