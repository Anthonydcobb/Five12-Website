<thead class="table-dark">
    <tr>
        <th>User ID</th>
        <th>Full Name</th> <!-- ✅ Added -->
        <th>Username</th>
        <th>Email</th>
        <th>Approved</th>
        <th>Admin</th>
    </tr>
</thead>
<tbody>
    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>  <!-- ✅ Fixed user ID field -->
        <td>{{ user.full_name }}</td> 
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ "✅ Yes" if user.is_approved else "❌ No" }}</td>
        <td>{{ "✅ Yes" if user.is_admin else "❌ No" }}</td>
    </tr>
    {% endfor %}
</tbody>
