{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>🎚 {{ patch.name }}</h1>
    <button id="addFixtureBtn" class="btn btn-primary">➕ Add Fixture</button>

    <!-- ✅ Restored Table -->
    <table id="patchTable" class="table table-bordered mt-3" data-patch-id="{{ patch.id }}">
        <thead>
            <tr>
                <th>Set</th>
                <th>Fix #</th>
                <th>Uni</th>
                <th>Add</th>
                <th>Fix Type</th>
                <th>Ch. Count</th>
                <th>Location</th>
                <th>Wattage</th>
                <th>Weight</th>
                <th>Firmware</th>
            </tr>
        </thead>
        <tbody>
            <!-- Patch data will go here -->
        </tbody>
    </table>

    <!-- Fixture Selection Modal -->
    <div class="modal fade" id="fixtureModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Choose Type</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Search Bar -->
                    <div class="input-group mb-3">
                        <input type="text" id="fixtureSearch" class="form-control" placeholder="Search fixture name...">
                        <button class="btn btn-outline-secondary" id="clearSearch">✖</button>
                    </div>

                    <!-- Fixture List Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Mode</th>
                                    <th>DMX Footprint</th>
                                    <th>Count</th>
                                </tr>
                            </thead>
                            <tbody id="fixtureList">
                                <!-- Fixtures will be dynamically loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="addFixtureConfirm" class="btn btn-success">OK</button>
                </div>
            </div>
        </div>
    </div>


    <!-- ✅ Load Bootstrap First -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ✅ Ensure `patch.js` Exists -->
    <script src="{{ url_for('static', filename='js/patch.js') }}"></script>
    <script src="{{ url_for('static', filename='js/edit_fixtures.js') }}"></script>
    {% endblock %}
